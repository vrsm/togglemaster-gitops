apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-self-healer
  namespace: observability
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-self-healer-restart
  namespace: togglemaster
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - auth-service
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-self-healer-restart
  namespace: togglemaster
subjects:
  - kind: ServiceAccount
    name: auth-self-healer
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-self-healer-restart
