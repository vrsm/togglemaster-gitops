apiVersion: v1
kind: Service
metadata:
  name: togglemaster-otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: togglemaster-otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: togglemaster-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: internal-metrics
      port: 8888
      targetPort: internal-metrics
      protocol: TCP
    - name: metrics
      port: 8889
      targetPort: metrics
      protocol: TCP
    - name: health
      port: 13133
      targetPort: health
      protocol: TCP
