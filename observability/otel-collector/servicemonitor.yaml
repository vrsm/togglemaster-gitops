apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: togglemaster-otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: togglemaster-otel-collector
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/name: togglemaster-otel-collector
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
