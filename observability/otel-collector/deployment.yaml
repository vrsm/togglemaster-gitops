apiVersion: apps/v1
kind: Deployment
metadata:
  name: togglemaster-otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: togglemaster-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: togglemaster-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: togglemaster-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.123.0
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8889
            - name: health
              containerPort: 13133
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-credentials
                  key: license-key
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: collector-config
          configMap:
            name: togglemaster-otel-collector
