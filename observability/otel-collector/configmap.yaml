apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-otel-collector
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 160
        spike_limit_mib: 40
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: togglemaster
        resource_to_telemetry_conversion:
          enabled: true

      otlphttp/loki:
        endpoint: http://loki-gateway.observability.svc.cluster.local/otlp

      otlphttp/newrelic:
        endpoint: https://otlp.nr-data.net
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
        compression: gzip

    service:
      extensions: [health_check]

      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888

      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/newrelic]

        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, otlphttp/newrelic]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki, otlphttp/newrelic]
