apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: togglemaster-discord
  namespace: observability
  labels:
    app.kubernetes.io/part-of: togglemaster

spec:
  route:
    receiver: togglemaster-discord
    groupBy:
      - alertname
      - service
    groupWait: 1s
    groupInterval: 1m
    repeatInterval: 1m
    routes:
      # Mantém a notificação Discord para o alerta de autenticação
      # e permite que o mesmo alerta também chegue ao Self-Healer.
      - receiver: togglemaster-discord
        matchers:
          - name: alertname
            value: AuthServiceHighHTTP5xxRate
            matchType: "="
        continue: true

      # Self-Healer recebe somente o alerta crítico de autenticação.
      - receiver: auth-self-healer
        matchers:
          - name: alertname
            value: AuthServiceHighHTTP5xxRate
            matchType: "="
          - name: service
            value: auth-service
            matchType: "="
          - name: severity
            value: critical
            matchType: "="

  receivers:
    - name: togglemaster-discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: url
          sendResolved: true
          title: '{{ .CommonLabels.alertname }}'
          message: >-
            {{ range .Alerts }}
            Serviço: {{ .Labels.service }}.
            Namespace: {{ .Labels.namespace }}.
            Severidade: {{ .Labels.severity }}.
            Resumo: {{ .Annotations.summary }}.
            Descrição: {{ .Annotations.description }}
            {{ end }}

    - name: auth-self-healer
      webhookConfigs:
        - url: http://auth-self-healer.observability.svc.cluster.local:9099/webhook
          sendResolved: false
          httpConfig:
            bearerTokenSecret:
              name: auth-self-healer-webhook
              key: token
