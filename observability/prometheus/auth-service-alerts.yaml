apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: auth-service-alerts
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    - name: auth-service.availability
      rules:
        - alert: AuthServiceHighHTTP5xxRate
          expr: |
            (
              sum(rate(http_requests_total{job="auth-service",status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_requests_total{job="auth-service"}[5m])), 1e-9)
            ) > 0.05
            and
            sum(rate(http_requests_total{job="auth-service"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
            service: auth-service
          annotations:
            summary: "Taxa de HTTP 5xx acima de 5% no auth-service"
            description: "Mais de 5% das requisições do auth-service retornaram HTTP 5xx nos últimos 5 minutos por pelo menos 2 minutos."
