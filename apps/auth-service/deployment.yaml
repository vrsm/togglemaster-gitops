apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: 523694734848.dkr.ecr.us-east-1.amazonaws.com/auth-service:f9896821a073f0c53ca323bfa8beb2fb3e4e4fb0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8001
        env:
        - name: PORT
          value: "8001"

        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: togglemaster-db
              key: AUTH_DATABASE_URL

        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: togglemaster-auth
              key: MASTER_KEY

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: togglemaster
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - name: http
    port: 8001
    targetPort: http
