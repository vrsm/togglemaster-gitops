apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: targeting-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
      - name: targeting-service
        image: 523694734848.dkr.ecr.us-east-1.amazonaws.com/targeting-service:e7f1d39483ac2183d867af3d333d5023e01f7ea9
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
        env:
        - name: OTEL_SERVICE_NAME
          value: targeting-service
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://togglemaster-otel-collector.observability.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_DEPLOYMENT_ENVIRONMENT
          value: production
        - name: PORT
          value: "8003"

        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: togglemaster-db
              key: TARGETING_DATABASE_URL

        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: AUTH_SERVICE_URL

        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: togglemaster-auth
              key: MASTER_KEY

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  type: ClusterIP
  selector:
    app: targeting-service
  ports:
  - port: 8003
    targetPort: 8003
