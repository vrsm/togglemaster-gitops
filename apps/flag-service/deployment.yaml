apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: flag-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
      - name: flag-service
        image: 523694734848.dkr.ecr.us-east-1.amazonaws.com/flag-service:6cd3ad5a1f66df153852cdc9361a6194c8229390
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        env:
        - name: OTEL_SERVICE_NAME
          value: flag-service
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://togglemaster-otel-collector.observability.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_DEPLOYMENT_ENVIRONMENT
          value: production
        - name: PORT
          value: "8002"

        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: togglemaster-db
              key: FLAG_DATABASE_URL

        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: AUTH_SERVICE_URL

        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: togglemaster-auth
              key: MASTER_KEY

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: togglemaster
  labels:
    app: flag-service
spec:
  type: ClusterIP
  selector:
    app: flag-service
  ports:
  - name: http
    port: 8002
    targetPort: 8002